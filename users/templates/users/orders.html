<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Данные поставщиков</title>
    <style>
        :root {
            --primary: #5cb85c;
            --secondary: #f0ad4e;
            --background: #f5f5f5;
        }
        .delete-btn {
            background: #ffffff;
            color: var(--error);
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .show-table {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;

        }
        table th, table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        table th {

            background-color: var(--primary);
            color: #ffffff;
            font-weight: bold;

        }
        table tr:hover {
            background-color: #f5f5f5;
        }
        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        a {
            color: #337ab7;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #23527c;
            text-decoration: underline;
        }
        .category-active {
            color: #5cb85c;
            font-weight: bold;
        }
        .category-inactive {
            color: #d9534f;
            font-weight: bold;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        #searchInput {
            width: 100%;
            padding: 12px 20px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s;
        }

        #searchInput:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(92, 184, 92, 0.2);
        }
        .contact-info span {
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Данные поставщиков</h2>

        <div class="show-table">
            <input type="text" id="searchInput" placeholder="Поиск по номеру, имени поставщика или категории" onkeyup="searchTable()">
            <table>
                <thead>
                    <tr>
                        <th>Имя поставщика</th>
                        <th>Контакт</th>
                        <th>Категория</th>
                        <th>Все заказы поставщика</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    {% for data in all_data %}
                    <tr>
                        <td>{{ data.name }}</td>
                        <td>
                            <div class="contact-info">
                                {{ data.contact }}
                                {% if data.email %}<span>{{ data.email }}</span>{% endif %}
                                {% if data.phone %}<span>{{ data.phone }}</span>{% endif %}
                            </div>
                        </td>
                        <td class="category-{{ data.category|lower|cut:' ' }}">
                            {{ data.category }}
                        </td>
                        <td><a href="{{ data.url }}">Перейти к заказам</a></td>
                        <td class="action-btns">
                            <button onclick="confirmDelete({{ data.id }})" class="action-btn delete-btn">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
<script>

    function confirmDelete(supplierId) {
        if (confirm('Вы уверены, что хотите удалить этого поставщика?')) {
            window.location.href = `/users/orders/delete_supplier/${supplierId}/`;
        }
    }
    function searchTable() {
        // Получаем значение поиска
        const input = document.getElementById("searchInput");
        const filter = input.value.toLowerCase();

        // Получаем таблицу и строки
        const table = document.querySelector("table");
        const trs = table.getElementsByTagName("tr");

        // Перебираем все строки таблицы, кроме заголовка
        for (let i = 1; i < trs.length; i++) {
            const tds = trs[i].getElementsByTagName("td");
            let showRow = false;

            // Проверяем каждую ячейку в строке
            for(let j = 0; j < tds.length; j++) {
                const td = tds[j];
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toLowerCase().indexOf(filter) > -1) {
                        showRow = true;
                        break;
                    }
                }
            }

            // Показываем/скрываем строку
            trs[i].style.display = showRow ? "" : "none";
        }
    }
</script>
</html>
